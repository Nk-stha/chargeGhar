# ============================================
# ChargeGhar Dashboard — Production Docker Compose
# ============================================
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
# ============================================

services:
  # ---- Next.js Frontend Application ----
  chargeghar-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://main.chargeghar.com/api}
    image: ${DOCKERHUB_USERNAME:-chargeghar}/chargeghar-dashboard:${IMAGE_TAG:-latest}
    container_name: chargeghar-frontend
    restart: unless-stopped
    ports:
      - "3500:3500"
    environment:
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:-https://main.chargeghar.com/api}
      - API_BASE_URL=${API_BASE_URL:-https://main.chargeghar.com/api}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://main.chargeghar.com/api}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
