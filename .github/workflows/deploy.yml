name: Build & Deploy ChargeGhar Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: chargeghar-dashboard

jobs:
  # ============================================
  # Job 1: Build, Test & Push Docker Image
  # ============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 2: Deploy to VPS via SSH
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Copy docker-compose and nginx config to VPS
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            docker-compose.yml \
            .env.production.example \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_DEPLOY_PATH/nginx"

          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=no \
            nginx/nginx.conf \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/nginx/"

          # Deploy on VPS
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" << 'DEPLOY_SCRIPT'
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "=========================================="
            echo "🚀 Deploying ChargeGhar Dashboard"
            echo "=========================================="

            # Save current image tag for rollback
            PREV_IMAGE=$(docker inspect chargeghar-frontend --format='{{.Config.Image}}' 2>/dev/null || echo "")
            echo "📌 Previous image: ${PREV_IMAGE:-none}"

            # Login to DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the latest image
            echo "📥 Pulling latest image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chargeghar-dashboard:latest

            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              echo "⚙️  Creating .env from template..."
              cp .env.production.example .env
              sed -i "s/your-dockerhub-username/${{ secrets.DOCKERHUB_USERNAME }}/g" .env
            fi

            # Update image tag in .env
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=latest/" .env

            # Deploy with docker compose
            echo "🔄 Starting containers..."
            docker compose up -d --no-build --force-recreate 2>&1 || {
              echo "❌ Deployment failed!"
              if [ -n "$PREV_IMAGE" ]; then
                echo "⏪ Rolling back to: $PREV_IMAGE"
                docker stop chargeghar-frontend 2>/dev/null || true
                docker rm chargeghar-frontend 2>/dev/null || true
                sed -i "s|image:.*|image: $PREV_IMAGE|g" docker-compose.yml
                docker compose up -d --no-build
              fi
              exit 1
            }

            # Wait for health check
            echo "🏥 Waiting for health check..."
            RETRIES=15
            for i in $(seq 1 $RETRIES); do
              if curl -sf http://localhost:3500/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed! (attempt $i/$RETRIES)"
                break
              fi
              if [ "$i" -eq "$RETRIES" ]; then
                echo "❌ Health check failed after $RETRIES attempts"
                if [ -n "$PREV_IMAGE" ]; then
                  echo "⏪ Rolling back..."
                  docker stop chargeghar-frontend 2>/dev/null || true
                  docker rm chargeghar-frontend 2>/dev/null || true
                  sed -i "s|image:.*|image: $PREV_IMAGE|g" docker-compose.yml
                  docker compose up -d --no-build
                fi
                exit 1
              fi
              echo "   Attempt $i/$RETRIES — waiting 10s..."
              sleep 10
            done

            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=72h"

            echo "=========================================="
            echo "✅ Deployment complete!"
            echo "=========================================="
            docker ps --filter "name=chargeghar"
          DEPLOY_SCRIPT
